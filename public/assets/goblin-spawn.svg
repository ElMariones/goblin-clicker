<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
  <title id="title">Goblin broodling</title>
  <desc id="desc">An original sharp-featured goblin broodling leaning out of a battered copper hatching bowl.</desc>
  <defs>
    <radialGradient id="skin" cx="38%" cy="24%" r="78%">
      <stop stop-color="#c8ef78"/>
      <stop offset=".42" stop-color="#91bd51"/>
      <stop offset=".76" stop-color="#648b38"/>
      <stop offset="1" stop-color="#3e5d29"/>
    </radialGradient>
    <linearGradient id="skin-shadow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#6f9940"/>
      <stop offset="1" stop-color="#355023"/>
    </linearGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#82633c"/>
      <stop offset=".55" stop-color="#4c3926"/>
      <stop offset="1" stop-color="#2b2118"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#a66a32"/>
      <stop offset=".45" stop-color="#70411f"/>
      <stop offset="1" stop-color="#382417"/>
    </linearGradient>
    <radialGradient id="eye" cx="50%" cy="45%" r="60%">
      <stop stop-color="#f3ffb4"/>
      <stop offset=".5" stop-color="#d7ee70"/>
      <stop offset="1" stop-color="#8ca630"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <ellipse cx="160" cy="273" rx="108" ry="24" fill="#060906" opacity=".72"/>
  <ellipse cx="160" cy="261" rx="93" ry="34" fill="#aee65d" opacity=".12" filter="url(#glow)"/>

  <!-- battered brood bowl -->
  <path fill="url(#copper)" stroke="#b0783e" stroke-width="4" d="M58 226c10 48 47 76 102 76s92-28 102-76c-55 18-149 18-204 0Z"/>
  <path fill="#24170f" d="M72 238c24 24 54 36 88 36s64-12 88-36c-45 15-131 15-176 0Z" opacity=".74"/>
  <path fill="none" stroke="#d2914c" stroke-width="4" d="M67 229c49 14 137 14 186 0" opacity=".52"/>
  <path fill="none" stroke="#3a2516" stroke-width="5" d="m83 248 13 11m135-12-14 12M111 275l6 11m92-12-7 12" opacity=".72"/>
  <path fill="#c78b45" d="m68 224 16-8 5 11-17 7Zm184 0-16-8-5 11 17 7Z" opacity=".75"/>

  <!-- shoulders and forearms -->
  <path fill="url(#skin-shadow)" stroke="#45642d" stroke-width="3" d="M113 188c-24 8-42 23-48 45l29 8 31-30-12-23Zm94 0c24 8 42 23 48 45l-29 8-31-30 12-23Z"/>
  <path fill="url(#skin)" d="M73 222c11-7 24-8 36-2l-6 13-30 1v-12Zm174 0c-11-7-24-8-36-2l6 13 30 1v-12Z"/>
  <path fill="#d7ed92" d="m82 220 7-7 4 11 8-8 3 14-22 2v-12Zm156 0-7-7-4 11-8-8-3 14 22 2v-12Z" opacity=".78"/>

  <!-- torn ears -->
  <path fill="url(#skin)" stroke="#577b31" stroke-width="3" d="M113 116C91 89 58 77 26 89c21 10 35 21 44 36-18-2-33 3-44 13 29 10 58 8 87-7v-15Z"/>
  <path fill="url(#skin)" stroke="#577b31" stroke-width="3" d="M207 116c22-27 55-39 87-27-21 10-35 21-44 36 18-2 33 3 44 13-29 10-58 8-87-7v-15Z"/>
  <path fill="#496b2c" d="M54 99c21 5 39 14 54 29-23-10-43-13-61-8l7-21Zm212 0c-21 5-39 14-54 29 23-10 43-13 61-8l-7-21Z" opacity=".66"/>
  <path fill="#273b1c" d="m34 93 25 9-9 8-16-17Zm252 0-25 9 9 8 16-17Z" opacity=".7"/>
  <path fill="none" stroke="#d6a951" stroke-width="5" d="M257 109c10 2 15 8 15 17"/>
  <circle cx="273" cy="128" r="6" fill="none" stroke="#e4bd68" stroke-width="3"/>

  <!-- head -->
  <path fill="url(#skin)" stroke="#577b31" stroke-width="3" d="M160 47c46 0 73 31 69 80l-4 49c-3 37-30 63-65 63s-62-26-65-63l-4-49c-4-49 23-80 69-80Z"/>
  <path fill="#d7ef8f" d="M126 63c15-8 31-10 47-8-21 4-34 11-45 22l-2-14Z" opacity=".5"/>
  <path fill="#48692b" d="M96 132c12-23 31-35 53-36l-11 13c-17 2-29 9-42 23Zm128 0c-12-23-31-35-53-36l11 13c17 2 29 9 42 23Z" opacity=".92"/>

  <!-- brows and eyes -->
  <path fill="#17220f" d="m105 130 46 7-13 10-33-3-9-7 9-7Zm110 0-46 7 13 10 33-3 9-7-9-7Z"/>
  <path fill="#0b1008" d="m108 145 39-2-10 17-24-2-8-7 3-6Zm104 0-39-2 10 17 24-2 8-7-3-6Z"/>
  <ellipse cx="127" cy="150" rx="10" ry="7" fill="url(#eye)"/>
  <ellipse cx="193" cy="150" rx="10" ry="7" fill="url(#eye)"/>
  <path fill="#17200f" d="m126 143 4 7-4 8-4-8 4-7Zm68 0 4 7-4 8-4-8 4-7Z"/>
  <circle cx="124" cy="147" r="2" fill="#f7ffd9"/>
  <circle cx="191" cy="147" r="2" fill="#f7ffd9"/>

  <!-- nose, cheek texture, scar -->
  <path fill="#567a31" stroke="#45642a" stroke-width="2" d="m160 145-19 38 19 9 19-9-19-38Z"/>
  <ellipse cx="150" cy="181" rx="6" ry="3" fill="#263c19"/>
  <ellipse cx="170" cy="181" rx="6" ry="3" fill="#263c19"/>
  <circle cx="121" cy="172" r="3" fill="#4b6e2c"/>
  <circle cx="129" cy="177" r="2" fill="#4b6e2c"/>
  <circle cx="200" cy="173" r="2.5" fill="#4b6e2c"/>
  <path fill="none" stroke="#45622b" stroke-width="3" stroke-linecap="square" d="m197 104-9 13 8 4-9 12"/>

  <!-- grin -->
  <path fill="#17220f" stroke="#3b5526" stroke-width="2" d="M126 195c19 13 49 13 68 0-4 26-16 39-34 39s-30-13-34-39Z"/>
  <path fill="#f2e7bd" d="m133 198 11 22 6-19-17-3Zm54 0-11 22-6-19 17-3Zm-38 5 8 15 4-16-12 1Zm22-1-8 16-3-16h11Z"/>
  <path fill="#8e3f31" d="M145 225c10-5 20-5 30 0-5 6-10 8-15 8s-10-2-15-8Z" opacity=".75"/>

  <!-- rough vest and brood charm -->
  <path fill="url(#leather)" stroke="#775535" stroke-width="3" d="M115 215c12 10 27 15 45 15s33-5 45-15l12 43H103l12-43Z"/>
  <path fill="#302319" d="m121 222 21 34h-33l12-34Zm78 0-21 34h33l-12-34Z" opacity=".8"/>
  <path fill="none" stroke="#a67a49" stroke-width="4" d="M132 231c10 8 18 11 28 11s18-3 28-11" opacity=".6"/>
  <path fill="#d7a84f" stroke="#6c4b25" stroke-width="2" d="m160 235 8 9-8 13-8-13 8-9Z"/>
  <circle cx="160" cy="245" r="3" fill="#dff68f"/>

  <!-- small asymmetrical highlights -->
  <path fill="#dff5a2" d="m115 86 7-5 4 7-8 4-3-6Zm88-10 5-3 3 5-6 3-2-5Z" opacity=".5"/>
  <rect x="106" y="109" width="9" height="3" rx="1.5" fill="#bddb75" opacity=".42" transform="rotate(-18 106 109)"/>
</svg>
